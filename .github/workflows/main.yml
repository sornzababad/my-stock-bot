name: Trading Bot Daily Alert

on:
  schedule:
    # 10:00 UTC คือ 17:00 น. เวลาไทย (UTC+7)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # ปุ่มกดรันเอง

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11' # ขยับมาใช้ 3.11 เพื่อความใหม่และเสถียร

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          # แก้ปัญหา Error ด้วยการติดตั้งตรงจาก GitHub ของผู้พัฒนา
          pip install git+https://github.com/twopirllc/pandas-ta.git@main

      - name: Run Trading Bot
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: python trading_bot.py
