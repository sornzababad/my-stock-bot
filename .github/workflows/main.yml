name: Trading Bot Daily Alert

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 17:00 น. เวลาไทย (UTC+7)
  workflow_dispatch:         # รันมือได้ทุกเมื่อ

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Verify secrets are set
        run: |
          if [ -z "$CHANNEL_ACCESS_TOKEN" ]; then
            echo "ERROR: LINE_ACCESS_TOKEN is not set!"
            exit 1
          fi
          if [ -z "$USER_ID" ]; then
            echo "ERROR: LINE_USER_ID is not set!"
            exit 1
          fi
          echo "Secrets verified OK"
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.LINE_USER_ID }}

      - name: Run Trading Bot
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python trading_bot.py
