name: Trading Bot Daily Alert

on:
  schedule:
    # 10:00 UTC คือ 17:00 น. เวลาไทย (UTC+7)
    # รันทุกวันจันทร์ - ศุกร์
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # ปุ่มสำหรับกด Run เองด้วยมือ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10' # ขยับขึ้นมาเป็น 3.10 เพื่อความเสถียร

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          # ติดตั้ง pandas-ta โดยระบุชื่อโปรเจกต์ที่ถูกต้อง
          pip install pandas-ta

      - name: Run Trading Bot
        env:
          # ดึงค่าจาก Secrets ที่คุณตั้งไว้
          CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: python trading_bot.py
